# object_detector ノード（AI 版の物体を探すノード）の設定。
# labels は物体の名前（layout_shapes.yaml の label）、prompts はそれぞれを検出モデルに渡す英語の文。
# 2 つのリストは同じ順に並べる。物体を増やすときは、学習し直さずに、ここに名前と文を足せばよい。
# 掴む対象ではない円柱（layout_shapes.yaml の distractors）も並べる。並べないと、赤い立方体を
# 箱に入れたあと、red_cube の名前が赤い円柱に移った（2026-10-28）。円柱に円柱の名前を
# 付けておけば、ほかの名前は円柱に付かない。
object_detector:
  ros__parameters:
    labels: [red_cube, red_cuboid, blue_cube, green_cuboid, red_cylinder, blue_cylinder]
    # 形の言い方は、検出モデルを比べたときに最もよく見分けられたもの。
    # 円柱は、cylinder では点数が 0.13〜0.17 と低く、round block では 0.44〜0.55 だった
    # （5 通りの配置。円柱の上での、ほかの 4 つの名前の点数は 0.21〜0.32）
    prompts: [red square block, red long block, blue square block, green long block,
              red round block, blue round block]
    # 検出モデル。owlv2 か clip（比べた結果は docs/design/261027_ai_detector.md）
    model: owlv2
    # これより点数の低い組み合わせは使わない。点数の意味はモデルごとに違い、
    # 比べたときは owlv2 0.1、clip 0.3 にした
    score_threshold: 0.1
    # 枠の中心を通る視線と交わらせる平面の高さ [m]
    plane_height: 0.035
    # 処理を減らす設定（docs/design/261027_ai_detector.md の 9 章）
    # 重みと計算を半精度（float16）にする。OWLv2 の推論が 144 ms から 52 ms になり、見分けは同じだった
    half_precision: true
    # 1 秒あたりの推論の回数の上限。0 なら、画像が届くたび（1 秒に約 5 枚）に推論する
    max_rate: 2.0
    # 腕が動いている間は推論しない
    skip_while_arm_moves: true
