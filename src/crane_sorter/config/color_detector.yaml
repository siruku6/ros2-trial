# color_detector ノードの設定。
# 色の範囲は OpenCV の HSV（H: 0〜179、S と V: 0〜255）で、
# [H, S, V の下限, H, S, V の上限] の 6 個を 1 組として並べる。
# 赤のように色相が 0 と 179 の両端にまたがる色は、2 組並べる。
color_detector:
  ros__parameters:
    labels: [red, green, blue]
    red:
      hsv_ranges: [0, 120, 70, 8, 255, 255, 172, 120, 70, 179, 255, 255]
    green:
      hsv_ranges: [45, 120, 50, 85, 255, 255]
    blue:
      hsv_ranges: [100, 120, 50, 130, 255, 255]
    # これより小さい画素のかたまりは雑音として捨てる。5 cm のキューブはおよそ 3000 画素に写る
    min_area: 300
    # 視線と交わらせる平面の高さ [m]。画素のかたまりの重心を通る視線と、この高さの平面との交点を
    # 物体の位置とする。5 cm のキューブは上面だけでなく側面も写るので、重心は上面（0.05 m）より
    # 低い点に当たる。0.05 にすると位置が最大 9 mm ずれ、Gazebo 上の正しい位置から逆算すると
    # 0.032〜0.039 m が合った（2026-10-25）
    plane_height: 0.035
